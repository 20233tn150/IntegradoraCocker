server.port=8080

spring.application.name=ecochain-service

# --- Datasource (sobrescrito por variables de entorno en docker-compose) ---
spring.datasource.url=jdbc:mysql://localhost:3306/ecochain?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# --- Datos de demostración (catálogos + lotes de ejemplo) ---
# Ponlo en false cuando ya tengas datos reales y no quieras que se siembren.
ecochain.seed-demo=true
